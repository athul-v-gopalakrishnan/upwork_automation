services:
  fastapi:
    volumes:
      - ./upwork_api:/app
      - ./playwright_cache:/root/.cache/ms-playwright
      - ./cloned-profile:/root/.config/chrome-profile
    restart: no
    command: /app/start.dev.sh
    env_file:
      - .env.dev
    ports:
      - "8000:8000"

  # n8n:
  #   volumes:
  #     - ./n8n_data:/home/node/.n8n
  #   env_file:
  #     - .env.dev
  #   environment:
  #     - N8N_HOST=${N8N_HOST}
  #     - N8N_PORT=${N8N_PORT}
  #     - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
  #     - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
  #     - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
  #     - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
  #     - N8N_RUNNERS_ENABLED=true
  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./upwork_frontend:/app
    env_file:
      - .env.dev
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

  postgres:
    env_file:
      - .env.dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5