services:
  fastapi:
    build: ./upwork_api
    container_name: fastapi_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DISPLAY=:99
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - backend

  # n8n:
  #   image: n8nio/n8n:latest
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - "5678:5678"
  #   volumes:
  #     - ./n8n_data:/home/node/.n8n
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     fastapi:
  #       condition: service_healthy
  #   networks:
  #     - backend

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  frontend:
    container_name: upwork_frontend
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
